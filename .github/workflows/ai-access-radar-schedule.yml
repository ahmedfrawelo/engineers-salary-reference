name: AI Access Radar scheduled monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-access-radar-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out radar branch
        uses: actions/checkout@v4
        with:
          ref: free-ai-api-index
          fetch-depth: 0

      - name: Verify public site, data manifest and rotating official sources
        id: monitor
        env:
          SITE_URL: https://smoky-anchor-5950.hosted.pageshare.ai/?health=1
        run: |
          python - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import os
          import pathlib
          import ssl
          import urllib.error
          import urllib.request

          root = pathlib.Path('.')
          manifest_path = root / 'ai-access-radar-live' / 'manifest.json'
          urls_path = root / 'ai-access-radar-monitor' / 'source-urls.txt'
          health_path = root / 'ai-access-radar-monitor' / 'health.json'
          health_path.parent.mkdir(parents=True, exist_ok=True)

          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
          ua = 'AI-Access-Radar-Monitor/1.0 (+https://github.com/ahmedfrawelo/engineers-salary-reference)'
          ctx = ssl.create_default_context()

          def probe(url: str, timeout: int = 25) -> dict:
              req = urllib.request.Request(url, headers={
                  'User-Agent': ua,
                  'Accept': 'text/html,application/json;q=0.9,*/*;q=0.8',
                  'Cache-Control': 'no-cache',
              })
              try:
                  with urllib.request.urlopen(req, timeout=timeout, context=ctx) as response:
                      code = int(getattr(response, 'status', 200))
                      response.read(1024)
                      return {'ok': code < 500, 'status': code}
              except urllib.error.HTTPError as exc:
                  # 401/403/429 still prove the host and route are alive; 5xx does not.
                  code = int(exc.code)
                  return {'ok': code < 500, 'status': code}
              except Exception as exc:
                  return {'ok': False, 'status': None, 'error': str(exc)[:180]}

          manifest_ok = False
          manifest: dict = {}
          manifest_error = None
          try:
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              manifest_ok = (
                  int(manifest.get('providers', 0)) >= 100
                  and int(manifest.get('students', 0)) >= 1
                  and bool(manifest.get('updatedAt'))
              )
          except Exception as exc:
              manifest_error = str(exc)[:200]

          site = probe(os.environ['SITE_URL'])

          urls = [line.strip() for line in urls_path.read_text(encoding='utf-8').splitlines()
                  if line.strip() and not line.lstrip().startswith('#')]
          sample_size = min(20, len(urls))
          rotation = (now.toordinal() * 4 + now.hour // 6) * sample_size
          sample = [urls[(rotation + i) % len(urls)] for i in range(sample_size)] if urls else []
          checked = []
          for url in sample:
              result = probe(url, timeout=18)
              checked.append({'url': url, **result})

          reachable = sum(1 for item in checked if item.get('ok'))
          failures = [item for item in checked if not item.get('ok')]

          updated_at = manifest.get('updatedAt')
          age_days = None
          stale = True
          if updated_at:
              try:
                  data_date = dt.date.fromisoformat(updated_at)
                  age_days = (now.date() - data_date).days
                  stale = age_days > 2
              except ValueError:
                  pass

          status = 'healthy'
          if not site.get('ok') or not manifest_ok or (checked and reachable < max(1, sample_size // 2)):
              status = 'failed'
          elif stale or failures:
              status = 'degraded'

          payload = {
              'status': status,
              'checkedAt': now.isoformat().replace('+00:00', 'Z'),
              'schedule': 'every 6 hours',
              'site': {'url': os.environ['SITE_URL'], **site},
              'data': {
                  'manifestOk': manifest_ok,
                  'manifestError': manifest_error,
                  'version': manifest.get('version'),
                  'updatedAt': updated_at,
                  'ageDays': age_days,
                  'stale': stale,
                  'providers': manifest.get('providers'),
                  'students': manifest.get('students'),
              },
              'sources': {
                  'totalConfigured': len(urls),
                  'checkedThisRun': sample_size,
                  'reachable': reachable,
                  'failed': len(failures),
                  'results': checked,
              },
          }
          health_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"status={status}\n")
              output.write(f"stale={'true' if stale else 'false'}\n")
          PY

      - name: Publish monitor status to radar branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-access-radar-monitor/health.json
          if git diff --cached --quiet; then
            echo "No status change to commit."
          else
            git commit -m "chore(radar): scheduled health status"
            git push origin HEAD:free-ai-api-index
          fi

      - name: Open one alert issue when the schedule is degraded
        if: steps.monitor.outputs.status != 'healthy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'AI Access Radar schedule alert in:title' --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "AI Access Radar schedule alert" \
              --body "The scheduled monitor reported **${{ steps.monitor.outputs.status }}**. Review \`ai-access-radar-monitor/health.json\` on branch \`free-ai-api-index\`. Data stale: **${{ steps.monitor.outputs.stale }}**."
          else
            echo "Alert issue #$existing is already open."
          fi
