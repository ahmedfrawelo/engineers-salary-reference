name: Deploy Free AI API Index

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-free-ai-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-ai-api-index-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static-site branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Prepare deployment directory
        run: |
          mkdir -p site/chunks
          cp index.html site/index.html
          cp chunks/*.js site/chunks/
          touch site/.nojekyll

      - name: Create project, deploy, and record result
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx --yes wrangler@latest pages project create free-ai-api-index --production-branch main > /tmp/project-create.log 2>&1
          PROJECT_CODE=$?

          DEPLOY_OUTPUT=$(npx --yes wrangler@latest pages deploy site --project-name free-ai-api-index --branch main --commit-dirty=true 2>&1)
          DEPLOY_CODE=$?
          printf '%s\n' "$DEPLOY_OUTPUT"

          URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | tail -n 1)
          if [ -z "$URL" ]; then URL="https://free-ai-api-index.pages.dev"; fi
          if [ "$DEPLOY_CODE" -eq 0 ]; then STATUS="success"; else STATUS="failed"; fi

          {
            echo "status=$STATUS"
            echo "url=$URL"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "project_create_code=$PROJECT_CODE"
            echo "deploy_code=$DEPLOY_CODE"
          } > deployment-status.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.txt
          git commit -m "Record Free AI API Index deployment status" || true
          git push origin HEAD:gh-pages

          exit "$DEPLOY_CODE"
