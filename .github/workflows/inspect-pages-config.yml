name: Inspect GitHub Pages configuration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-pages-config.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout status branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch Pages configuration and verify assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/pages" > pages-config.json
          SITE="https://ahmedfrawelo.github.io/engineers-salary-reference/"
          ROOT_CODE=$(curl -sS -L -o /tmp/root.html -w "%{http_code}" "$SITE")
          CHUNK_OK=true
          for n in 0 1 2 3; do
            CODE=$(curl -sS -L -o "/tmp/$n.js" -w "%{http_code}" "${SITE}chunks/$n.js")
            if [ "$CODE" != "200" ]; then CHUNK_OK=false; fi
          done
          TITLE=$(grep -o '<title>[^<]*' /tmp/root.html | head -n1 | sed 's/<title>//')
          {
            echo "root_http=$ROOT_CODE"
            echo "chunks_http=$CHUNK_OK"
            echo "title=$TITLE"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > site-health.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-config.json site-health.txt
          git commit -m "Record permanent GitHub Pages configuration and health" || true
          git push origin HEAD:gh-pages
