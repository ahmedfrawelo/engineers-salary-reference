<app-side-drawer
  [open]="open"
  [mode]="drawerMode"
  [width]="width"
  [zIndex]="zIndex"
  [topInset]="topInset"
  [backdropTint]="0"
  [backdropBlur]="0"
  [ignoreOutsideSelectors]="ignoreOutsideSelectors"
  [motionPreset]="'instant'"
  [panelClass]="panelClass"
  [overlayPanelClass]="overlayPanelClass"
  [title]="title"
  [showHeader]="true"
  [showModeToggle]="true"
  [actionsTemplate]="drawerActions"
  [contentTemplate]="drawerContent"
  (modeChange)="onDrawerModeChange($event)"
  (closed)="closed.emit()"
>
  <ng-template #drawerActions>
    <ng-content select="[customize-panel-header-actions]"></ng-content>
    @if (actionIcon) {
      <div class="app-icon-action-split" [class.has-menu]="actionMenuItems.length > 0">
        <button class="app-icon-action app-icon-action--main" type="button" [disabled]="actionDisabled" [title]="actionLabel" [attr.aria-label]="actionLabel" (click)="action.emit()">
          <i [appIcon]="actionIcon" aria-hidden="true"></i>
        </button>
        @if (actionMenuItems.length) {
          <details #actionMenuDetails class="app-icon-action-menu">
            <summary class="app-icon-action app-icon-action--trigger" [attr.aria-label]="actionLabel + ' options'" (click)="$event.stopPropagation()"><i appIcon="chevron-down" aria-hidden="true"></i></summary>
            <div class="app-icon-action-menu__panel">
              @for (item of actionMenuItems; track item.id) {
                <button type="button" [disabled]="actionDisabled" (click)="actionMenuDetails.removeAttribute('open'); actionMenu.emit(item.id)">
                  @if (item.icon) { <i [appIcon]="item.icon" aria-hidden="true"></i> }
                  <span>{{ item.label }}</span>
                </button>
              }
            </div>
          </details>
        }
      </div>
    }
  </ng-template>

  <ng-template #drawerContent>
    <section class="customize-drawer-surface shared-customize-drawer-surface" aria-label="Customize view">
      <div class="customize-drawer-body">
      @if (showDefaultContent) {
        <section class="customize-drawer-section customize-drawer-section--first">
          <div class="customize-drawer-view-pill" aria-label="Current view">
            <span class="customize-drawer-view-icon"><i [appIcon]="viewIcon" aria-hidden="true"></i></span>
            <span>{{ viewLabel }}</span>
          </div>
        </section>

        <section class="customize-drawer-section">
          <button class="customize-row customize-row--nav" type="button" (click)="openFields.emit()">
            <span class="customize-row-main"><i appIcon="layout-three-columns" aria-hidden="true"></i><span>Fields</span></span>
            <span class="customize-row-side"><span class="customize-row-value">{{ fieldsSummary }}</span><i appIcon="chevron-right" aria-hidden="true"></i></span>
          </button>
          <button class="customize-row customize-row--nav" type="button" (click)="openFilters.emit()">
            <span class="customize-row-main"><i appIcon="funnel" aria-hidden="true"></i><span>Filter</span></span>
            <span class="customize-row-side"><span class="customize-row-value">{{ filterSummary }}</span><i appIcon="chevron-right" aria-hidden="true"></i></span>
          </button>
          <button class="customize-row customize-row--nav" type="button" (click)="openGroup.emit()">
            <span class="customize-row-main"><i appIcon="layers" aria-hidden="true"></i><span>Group</span></span>
            <span class="customize-row-side"><span class="customize-row-value">{{ groupSummary }}</span><i appIcon="chevron-right" aria-hidden="true"></i></span>
          </button>
        </section>
      }
      <ng-content></ng-content>
      </div>
    </section>
  </ng-template>
</app-side-drawer>
